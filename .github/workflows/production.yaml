name: "DEV DEPLOY"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yaml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::685175429594:role/github-actions-psantos10-cesae-devops-2025"
      aws-region: "eu-west-1"
      aws-statefile-s3-bucket: ""
      aws-lock-dynamodb-table: ""
